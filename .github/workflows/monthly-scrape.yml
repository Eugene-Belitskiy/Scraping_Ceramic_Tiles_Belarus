name: Monthly scrape and upload

on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:
    inputs:
      run_21vek:
        description: 'Запустить парсер 21vek'
        type: boolean
        default: true
      run_altagamma:
        description: 'Запустить парсер Altagamma'
        type: boolean
        default: true
      run_modus:
        description: 'Запустить парсер Modus Keramica'
        type: boolean
        default: true

env:
  PYTHON_VERSION: '3.11'

permissions:
  contents: read
  actions: read  # нужно action-download-artifact ниже, чтобы читать артефакты прошлых запусков

jobs:
  scrape-21vek:
    if: github.event_name != 'workflow_dispatch' || inputs.run_21vek == true
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Довыгружает то, что уже успешно собрали в предыдущем запуске ЭТОГО ЖЕ месяца
      # (имя файла результата привязано к месяцу, поэтому в начале нового месяца
      # восстанавливать нечего - шаг просто ничего не найдёт и продолжит без него).
      # already_done в get_data() сам пропустит уже готовое и дотянет только то,
      # что не удалось в прошлый раз.
      - name: Restore previous run's partial results (top-up within the same month)
        uses: dawidd6/action-download-artifact@v24
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: monthly-scrape.yml
          workflow_conclusion: ''
          name: data-21vek
          path: 21vek
          if_no_artifact_found: warn

      - run: pip install -r requirements.txt

      - run: python 21vek/21vek_request.py

      - uses: actions/upload-artifact@v4
        with:
          name: data-21vek
          path: 21vek/data_*_21_vek_Tile.json
          retention-days: 30
          if-no-files-found: warn

  scrape-altagamma:
    if: github.event_name != 'workflow_dispatch' || inputs.run_altagamma == true
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Restore previous run's partial results (top-up within the same month)
        uses: dawidd6/action-download-artifact@v24
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: monthly-scrape.yml
          workflow_conclusion: ''
          name: data-altagamma
          path: Altagamma
          if_no_artifact_found: warn

      - uses: browser-actions/setup-chrome@v2
        id: setup-chrome
        with:
          chrome-version: stable
          install-chromedriver: true

      - name: Show setup-chrome outputs
        run: |
          echo "chrome-path: ${{ steps.setup-chrome.outputs.chrome-path }}"
          echo "chrome-version: ${{ steps.setup-chrome.outputs.chrome-version }}"
          echo "chromedriver-path: ${{ steps.setup-chrome.outputs.chromedriver-path }}"
          echo "chromedriver-version: ${{ steps.setup-chrome.outputs.chromedriver-version }}"

      - run: pip install -r requirements.txt

      - run: python Altagamma/Altagamma.py
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROME_VERSION: ${{ steps.setup-chrome.outputs.chrome-version }}
          CHROMEDRIVER_PATH: ${{ steps.setup-chrome.outputs.chromedriver-path }}

      - uses: actions/upload-artifact@v4
        with:
          name: data-altagamma
          path: Altagamma/data_*_altagamma.json
          retention-days: 30
          if-no-files-found: warn

  scrape-modus:
    if: github.event_name != 'workflow_dispatch' || inputs.run_modus == true
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Restore previous run's partial results (top-up within the same month)
        uses: dawidd6/action-download-artifact@v24
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: monthly-scrape.yml
          workflow_conclusion: ''
          name: data-modus
          path: Modus_Keramica
          if_no_artifact_found: warn

      - run: pip install -r requirements.txt

      - run: python Modus_Keramica/Modus.py

      - uses: actions/upload-artifact@v4
        with:
          name: data-modus
          path: Modus_Keramica/data_*_Modus.json
          retention-days: 30
          if-no-files-found: warn

  merge-and-upload:
    needs: [scrape-21vek, scrape-altagamma, scrape-modus]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - run: pip install -r requirements.txt

      - name: Download 21vek data
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: data-21vek
          path: 21vek

      - name: Download Altagamma data
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: data-altagamma
          path: Altagamma

      - name: Download Modus data
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: data-modus
          path: Modus_Keramica

      - name: Merge and harmonize
        working-directory: MERGED_BELARUS
        run: python Main_scraping_Belarus.py

      - name: Upload to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          # service_role, не anon - anon упирается в RLS (только SELECT), см.
          # комментарий в dashboard/upload_to_supabase.py
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python dashboard/upload_to_supabase.py

      - uses: actions/upload-artifact@v4
        with:
          name: merged-data
          path: |
            MERGED_BELARUS/products.json
            MERGED_BELARUS/prices.json
          retention-days: 30
